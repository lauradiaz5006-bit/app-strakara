<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Les nombres</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<header class="cassie-header">
  <h1>🔢 Les nombres</h1>
  <p>Trouve le plus grand, le plus petit, ou celui qui vient après !</p>
</header>

<main>
  <a class="back-link" href="index.html">← Retour à l'accueil</a>
  <div id="game-root"></div>
</main>

<script src="shared.js?v=3"></script>
<script>
function uniqueOptionsWith(a, b, correct, max) {
  const set = new Set([a, b]);
  let tries = 0;
  while (set.size < 4 && tries < 30) {
    const candidate = correct + randInt(-5, 5);
    if (candidate >= 0 && candidate <= max) set.add(candidate);
    tries++;
  }
  return shuffle([...set].slice(0, 4));
}

function genQuestion(max) {
  const type = randInt(0, 2);
  if (type === 0) {
    const a = randInt(1, max), b = randInt(1, max);
    if (a === b) return genQuestion(max);
    const correct = Math.max(a, b);
    return { text: `Quel est le plus grand nombre : ${a} ou ${b} ?`, correct, options: uniqueOptionsWith(a, b, correct, max) };
  } else if (type === 1) {
    const a = randInt(1, max), b = randInt(1, max);
    if (a === b) return genQuestion(max);
    const correct = Math.min(a, b);
    return { text: `Quel est le plus petit nombre : ${a} ou ${b} ?`, correct, options: uniqueOptionsWith(a, b, correct, max) };
  } else {
    const n = randInt(1, max - 1);
    const correct = n + 1;
    return { text: `Quel nombre vient juste après ${n} ?`, correct, options: fakeAnswersAround(correct, 0, max + 1) };
  }
}

async function start() {
  const level = await chooseAdaptiveLevel("nombres", 3);
  const max = level === 1 ? 20 : level === 2 ? 50 : 100;
  runQuizGame(document.getElementById("game-root"), "nombres", () => genQuestion(max), 6);
}
start();
</script>
</body>
</html>
