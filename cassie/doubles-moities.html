<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF9F45">
<title>Doubles et moitiés</title>
<link rel="stylesheet" href="style.css?v=8" />
<style>
  .objets-ligne { font-size: 2.4rem; line-height: 1.3; letter-spacing: 4px; }
</style>
</head>
<body>

<header class="cassie-header">
  <h1>🪞 Doubles et moitiés</h1>
  <p>Regarde bien les objets, puis devine !</p>
</header>

<main>
  <a class="back-link" href="index.html">← Retour à l'accueil</a>
  <div id="game-root"></div>
</main>

<script src="shared.js?v=8"></script>
<script>
const objetsEmoji = ["🍓", "🍎", "🎈", "🐟", "🌟", "🧸"];

function genQuestion(level) {
  const emoji = objetsEmoji[randInt(0, objetsEmoji.length - 1)];
  const isDouble = Math.random() < 0.5;
  const petit = level === 1;
  const rep = (n) => petit ? `<div class="objets-ligne">${emoji.repeat(n)}</div>` : level >= 4 ? `<div style="font-size:3rem;font-weight:800;text-align:center;margin:8px 0">${n}</div>` : blocsPour(n);
  let n, correct, html;
  if (isDouble) {
    n = petit ? randInt(1, 6) : level === 2 ? randInt(5, 25) : level === 3 ? randInt(25, 50) : randInt(50, 250);
    correct = n * 2;
    html = `
      <div class="niveau-badge">Niveau ${level}</div>
      ${rep(n)}
      <p style="font-size:1.1rem; font-weight:700; color:#6b6484; margin:10px 0 0;">${petit ? `Si on double, ça fait combien de ${emoji} ?` : "Si on double ce nombre, ça fait combien ?"}</p>
    `;
  } else {
    n = (petit ? randInt(1, 6) : level === 2 ? randInt(5, 25) : level === 3 ? randInt(25, 50) : randInt(50, 250)) * 2;
    correct = n / 2;
    html = `
      <div class="niveau-badge">Niveau ${level}</div>
      ${rep(n)}
      <p style="font-size:1.1rem; font-weight:700; color:#6b6484; margin:10px 0 0;">${petit ? `La moitié de ces ${emoji}, ça fait combien ?` : "La moitié de ce nombre, ça fait combien ?"}</p>
    `;
  }
  const options = fakeAnswersAround(correct, 0, petit ? 14 : 510, level >= 4);
  return { text: html, correct, options };
}

async function start() {
  const level = await chooseAdaptiveLevel("doubles-moities", 4);
  runQuizGame(document.getElementById("game-root"), "doubles-moities", () => genQuestion(level), 6);
}
start();
</script>
</body>
</html>
