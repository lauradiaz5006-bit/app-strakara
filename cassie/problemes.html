<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF9F45">
<title>Petits problèmes</title>
<link rel="stylesheet" href="style.css?v=7" />
<style>
  .question-text { font-size: 1.6rem; line-height: 1.4; }
  .objets-ligne { font-size: 2.2rem; letter-spacing: 3px; margin: 10px 0; }
</style>
</head>
<body>

<header class="cassie-header">
  <h1>🧩 Petits problèmes</h1>
  <p>Regarde l'image, écoute l'histoire, et trouve la réponse !</p>
</header>

<main>
  <a class="back-link" href="index.html">← Retour à l'accueil</a>
  <div id="game-root"></div>
</main>

<script src="shared.js?v=7"></script>
<script>
const objets = [
  { emoji: "🍎", nom: "pommes" },
  { emoji: "🎈", nom: "ballons" },
  { emoji: "🐟", nom: "poissons" },
  { emoji: "🧸", nom: "peluches" },
  { emoji: "🍬", nom: "bonbons" },
  { emoji: "⭐", nom: "étoiles" },
];
const prenoms = ["Cassie", "Léo", "Mia", "Tom", "Léa"];
const feminins = ["Cassie", "Mia", "Léa"];

function genQuestion(level) {
  const obj = objets[randInt(0, objets.length - 1)];
  const prenom = prenoms[randInt(0, prenoms.length - 1)];
  const pronom = feminins.includes(prenom) ? "elle" : "il";
  const isAddition = Math.random() < 0.5;
  const petit = level === 1;
  const rep = (n) => petit ? `<div class="objets-ligne">${obj.emoji.repeat(n)}</div>` : blocsPour(n);
  let text, correct, a, b;
  if (isAddition) {
    a = petit ? randInt(2, 6) : level === 2 ? randInt(10, 40) : randInt(40, 80);
    b = petit ? randInt(1, 5) : level === 2 ? randInt(5, 20) : randInt(10, 40);
    correct = a + b;
    text = `<div class="niveau-badge">Niveau ${level}</div>${prenom} a ${a} ${obj.nom}.${rep(a)}On lui en donne ${b} de plus.${rep(b)}Combien ${pronom === "elle" ? "en a-t-elle" : "en a-t-il"} maintenant ?`;
  } else {
    a = petit ? randInt(6, 10) : level === 2 ? randInt(20, 50) : randInt(50, 100);
    b = petit ? randInt(1, a - 2) : randInt(5, Math.floor(a / 2));
    correct = a - b;
    text = `<div class="niveau-badge">Niveau ${level}</div>${prenom} a ${a} ${obj.nom}.${rep(a)}${pronom === "elle" ? "Elle" : "Il"} en donne ${b} à un copain.<br/>Combien lui en reste-t-il ?`;
  }
  const options = fakeAnswersAround(correct, 0, petit ? 16 : 150);
  return { text, correct, options };
}

async function start() {
  const level = await chooseAdaptiveLevel("problemes", 3);
  runQuizGame(document.getElementById("game-root"), "problemes", () => genQuestion(level), 5);
}
start();
</script>
</body>
</html>
