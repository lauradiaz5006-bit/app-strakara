<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compte et calcule</title>
<link rel="stylesheet" href="style.css?v=4" />
<style>
  .objets-ligne { font-size: 2.4rem; line-height: 1.3; letter-spacing: 4px; }
  .objets-bloc { margin: 6px 0; }
  .objets-signe { font-family: var(--display); font-size: 2rem; color: var(--bleu-fonce); margin: 4px 0; }
</style>
</head>
<body>

<header class="cassie-header">
  <h1>⚡ Compte et calcule</h1>
  <p>Compte les objets, puis trouve le total !</p>
</header>

<main>
  <a class="back-link" href="index.html">← Retour à l'accueil</a>
  <div id="game-root"></div>
</main>

<script src="shared.js?v=4"></script>
<script>
const objetsEmoji = ["🍓", "🍎", "🎈", "🐟", "🌟", "🧸", "🍬", "🚗"];

function ligneObjets(emoji, n) {
  return `<div class="objets-ligne objets-bloc">${emoji.repeat(n)}</div>`;
}

function genQuestion() {
  const emoji = objetsEmoji[randInt(0, objetsEmoji.length - 1)];
  const isAddition = Math.random() < 0.6;
  let a, b, correct, html;
  if (isAddition) {
    a = randInt(1, 7);
    b = randInt(1, 6);
    correct = a + b;
    html = `
      ${ligneObjets(emoji, a)}
      <div class="objets-signe">+</div>
      ${ligneObjets(emoji, b)}
      <div class="objets-signe">= ?</div>
      <p style="font-size:1rem; font-weight:700; color:#6b6484;">Combien de ${emoji} en tout ?</p>
    `;
  } else {
    a = randInt(5, 10);
    b = randInt(1, a - 1);
    correct = a - b;
    const restants = a - b;
    html = `
      ${ligneObjets(emoji, a)}
      <div class="objets-signe">On en enlève ${b}</div>
      <p style="font-size:1rem; font-weight:700; color:#6b6484;">Combien de ${emoji} va-t-il rester ?</p>
    `;
  }
  const options = fakeAnswersAround(correct, 0, 16);
  return { text: html, correct, options };
}

runQuizGame(document.getElementById("game-root"), "compte-et-calcule", genQuestion, 6);
</script>
</body>
</html>
