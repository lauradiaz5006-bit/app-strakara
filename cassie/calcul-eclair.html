<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compte et calcule</title>
<link rel="stylesheet" href="style.css?v=6" />
<style>
  .objets-ligne { font-size: 2.4rem; line-height: 1.3; letter-spacing: 4px; }
  .objets-bloc { margin: 6px 0; }
  .objets-signe { font-family: var(--display); font-size: 2rem; color: var(--bleu-fonce); margin: 4px 0; }
</style>
</head>
<body>

<header class="cassie-header">
  <h1>⚡ Compte et calcule</h1>
  <p>Compte les objets, puis trouve le total !</p>
</header>

<main>
  <a class="back-link" href="index.html">← Retour à l'accueil</a>
  <div id="game-root"></div>
</main>

<script src="shared.js?v=6"></script>
<script>
const objetsEmoji = ["🍓", "🍎", "🎈", "🐟", "🌟", "🧸", "🍬", "🚗"];

function ligneObjets(emoji, n) {
  return `<div class="objets-ligne objets-bloc">${emoji.repeat(n)}</div>`;
}

function genQuestion(level) {
  const emoji = objetsEmoji[randInt(0, objetsEmoji.length - 1)];
  const isAddition = Math.random() < 0.6;
  const petit = level === 1;
  let a, b, correct, html;
  const rep = (n) => petit ? ligneObjets(emoji, n) : blocsPour(n);
  if (isAddition) {
    a = petit ? randInt(1, 7) : level === 2 ? randInt(10, 40) : randInt(40, 80);
    b = petit ? randInt(1, 6) : level === 2 ? randInt(5, 20) : randInt(10, 40);
    correct = a + b;
    html = `
      <div class="niveau-badge">Niveau ${level}</div>
      ${rep(a)}
      <div class="objets-signe">+</div>
      ${rep(b)}
      <div class="objets-signe">= ?</div>
      <p style="font-size:1rem; font-weight:700; color:#6b6484;">${petit ? `Combien de ${emoji} en tout ?` : "Combien ça fait en tout ?"}</p>
    `;
  } else {
    a = petit ? randInt(5, 10) : level === 2 ? randInt(20, 50) : randInt(50, 100);
    b = petit ? randInt(1, a - 1) : randInt(5, Math.floor(a / 2));
    correct = a - b;
    html = `
      <div class="niveau-badge">Niveau ${level}</div>
      ${rep(a)}
      <div class="objets-signe">${petit ? `On en enlève ${b}` : `On enlève ${b}`}</div>
      <p style="font-size:1rem; font-weight:700; color:#6b6484;">${petit ? `Combien de ${emoji} va-t-il rester ?` : "Combien va-t-il rester ?"}</p>
    `;
  }
  const options = fakeAnswersAround(correct, 0, petit ? 16 : 150);
  return { text: html, correct, options };
}

async function start() {
  const level = await chooseAdaptiveLevel("compte-et-calcule", 3);
  runQuizGame(document.getElementById("game-root"), "compte-et-calcule", () => genQuestion(level), 6);
}
start();
</script>
</body>
</html>
